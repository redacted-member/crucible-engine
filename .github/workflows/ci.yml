# SPDX-License-Identifier: MIT
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  # Nightly run (off for now):
  # schedule:
  #   - cron: "17 3 * * *"

permissions:
  contents: read

env:
  # Hosted runners share their cores, so the CPU-budget and timing expectations of the tests are not meaningful there:
  # they are logged as skips. Local runs (tools/ci.sh) leave this unset and keep enforcing them.
  CRUCIBLE_SKIP_CPU_TESTS: "1"

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64 (Apple clang), os: macos-14, cc: clang, cxx: clang++, jobs: 3 }
          - { name: Ubuntu gcc, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, jobs: 2 }
          - { name: Ubuntu clang, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, jobs: 2 }
          - { name: Windows MSVC, os: windows-2022, cc: cl, cxx: cl, jobs: 2 }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package nightly artifact
        if: github.event_name == 'schedule'
        shell: bash
        run: cmake --install build --config Release --prefix dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'schedule'
        with:
          name: crucible-engine-nightly-${{ matrix.os }}
          path: dist

  # Full sanitizer suites, including the audit and the older-effects acceptance run, run locally via tools/ci.sh.
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ASan + UBSan, mode: asan, sanitize: "address;undefined", skip: "audit|older_fx_acceptance$|consumer|^crucible_engine_tests$" }
          - { name: TSan, mode: tsan, sanitize: "thread", skip: "audit|older_fx_acceptance$|consumer|^crucible_engine_tests$" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_C_COMPILER=clang-18
          "-DCRUCIBLE_ENGINE_SANITIZE=${{ matrix.sanitize }}"
      - name: Build
        run: >
          cmake --build build --parallel 2 --target
          crucible_engine_tests crucible_capi_test crucible_engine_graph_tests crucible_engine_older_fx_tests
          crucible_engine_fx_baseline crucible-render crucible-module-check render_c instrument_skeleton
          crucible_example_c_module crucible_example_c_module_future crucible_example_cpp_module
      - name: Test
        env:
          # ThreadSanitizer's shadow memory otherwise grows without bound over the long test run (10 GB after two hours
          # locally), which exhausts the 16 GB runner and kills it.
          TSAN_OPTIONS: flush_memory_ms=20000
          # One test builds a table of over a million frames (about 12 GB); with the sanitizer's shadow memory it
          # exceeds the runner, so the sanitizer jobs skip it. The plain builds run it.
          CRUCIBLE_SKIP_HEAVY_TESTS: "1"
        run: |
          # Memory and load every two minutes, so a runner that dies mid-test leaves a trace in the log.
          (while true; do date +%T; free -m | sed -n 2p; uptime; sleep 120; done) &
          ctest --test-dir build --output-on-failure --verbose -E "${{ matrix.skip }}"
      - name: Targeted suites of crucible_engine_tests
        env:
          TSAN_OPTIONS: flush_memory_ms=20000
          CRUCIBLE_SKIP_HEAVY_TESTS: "1"
        run: |
          # The whole crucible_engine_tests binary takes hours under a sanitizer (the full runs are local, tools/ci.sh):
          # run the suites that use threads, and under ASan also the parsers of untrusted input (patches, MIDI files,
          # impulse responses, wavetables, presets, tuning files).
          suites=("Engine facade" "Host plumbing" "Views" "Audio-rate modulation" "FormantTableEngine" "Fuzz crash fixes"
              "Key lock" "Instance-scoped registry" "UI accessors" "Wavetable memory" "Sample unison" "Graph in data" "Sequencer")
          if [ "${{ matrix.mode }}" = asan ]; then
            suites+=("Patches, JSON and MIDI files" "Impulse response import" "User wavetables and cloud" "Fuzz state fixes"
                "Preset metadata, library and migration" "Microtuning, MPE, play modes and CC maps" "Multisample zones")
          fi
          status=0
          for suite in "${suites[@]}"; do
            build/crucible_engine_tests "$suite" || status=1
          done
          exit $status

  scalar:
    name: Scalar fallback (no SIMD)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRUCIBLE_FORCE_SCALAR=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure

  consumer:
    name: find_package consumer and C example
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRUCIBLE_ENGINE_BUILD_TESTS=OFF
      - run: cmake --build build --parallel 2
      - run: tools/test-consumer.sh build
      - name: C API example renders a non-silent WAV
        run: |
          build/render_c "$RUNNER_TEMP/demo.wav"
          test "$(wc -c < "$RUNNER_TEMP/demo.wav")" -gt 100000

  checks:
    name: clang-format and SPDX
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SPDX headers
        run: tools/check-spdx.sh
      - name: clang-format (changed lines only)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-18
          base=$(git merge-base origin/main HEAD 2>/dev/null || git rev-parse HEAD~1)
          diff=$(git diff -U0 --no-color "$base" -- '*.cpp' '*.h' '*.c' | clang-format-diff-18 -p1 || true)
          if [ -n "$diff" ]; then echo "$diff"; echo "Run clang-format on the lines above."; exit 1; fi
