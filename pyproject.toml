# SPDX-License-Identifier: MIT
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# `pip install crucible-engine`, `import crucible_engine`. Not published to PyPI yet.
name = "crucible-engine"
version = "0.1.0"
description = "Offline rendering of the Crucible synth engine from Python (ctypes over the plain C API)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crucible Engine contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
requires-python = ">=3.9"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/redacted-member/crucible-engine"
Source = "https://github.com/redacted-member/crucible-engine"
Issues = "https://github.com/redacted-member/crucible-engine/issues"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["crucible_engine"]

[tool.setuptools.package-data]
# Copy the library built with -DCRUCIBLE_ENGINE_SHARED=ON next to the package before building a wheel.
crucible_engine = ["libcrucible.dylib", "libcrucible.so", "crucible.dll"]
